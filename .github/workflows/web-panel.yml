name: Web panel

on:
  push:
    branches: [main]
    paths:
      - 'panel/**'
      - '.github/workflows/web-panel.yml'
      - '.nvmrc'
  pull_request:
    paths:
      - 'panel/**'
      - '.github/workflows/web-panel.yml'
      - '.nvmrc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-panel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel:
    name: PHP ${{ matrix.php }} / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    defaults:
      run:
        working-directory: panel
        shell: bash
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, curl, dom, fileinfo, filter, hash, iconv, mbstring, openssl, pdo_sqlite, session, sodium, sqlite3, tokenizer, xml, xmlwriter, zip, pcntl, posix
          coverage: none
          tools: composer:2.10.3

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Validate and install locked PHP dependencies
        run: |
          composer validate
          composer install --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs
          composer audit

      - name: Check PHP syntax and style
        run: |
          composer check:syntax
          composer check:style

      - name: Install and build locked frontend dependencies
        run: |
          npm ci --no-fund
          npm audit
          npm run build

      - name: Initialize isolated CI application
        run: |
          composer run post-root-package-install
          php -r "file_exists('database/database.sqlite') || touch('database/database.sqlite');"
          php artisan key:generate --no-interaction
          php artisan migrate --no-interaction
          php artisan migrate:status --no-interaction

      - name: Compile templates and check queue startup
        run: |
          php artisan view:cache --no-interaction
          php artisan queue:work --once --no-interaction

      - name: Run panel tests
        run: php artisan test --compact
