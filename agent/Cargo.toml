[package]
name = "hostnur-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Hostnur privileged operations agent (foundation scaffold)"
repository = "https://github.com/maelzx/hostnur"
publish = false

[dependencies]
age = "0.10"
sha2 = "0.10"
hmac = "0.12"
ureq = "2"
getrandom = "0.4.3"
libc = "0.2.190"
nix = { version = "0.31.3", features = ["socket", "user", "fs", "signal", "process", "hostname"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.5"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
